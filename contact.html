<body>

<header class="site-header">
  <div class="wrap header-inner">
    <a href="index.html" class="logo">Nick</a>
    <nav class="nav">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="poems.html">Poems</a>
      <a href="contact.html">Contact</a>
      <a href="links.html" class="nav-highlight">Links</a>
    </nav>
    <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<main>

  <section class="page-hero">
    <div class="wrap">
      <p class="eyebrow">Contact</p>
      <h1>Get in touch</h1>
    </div>
  </section>

  <section class="contact section-dark">
    <div class="wrap contact-inner">
      <div class="contact-text">
        <p>
          Reach out about readings, submissions, collaborations, or just to say hello.
        </p>
        <p class="contact-alt">
          Or email directly at
          <a href="mailto:nn999@nyu.edu">nn999@nyu.edu</a>
        </p>
      </div>

      <!-- Replace YOUR_FORM_ID below with your Formspree form ID once you've created one at formspree.io -->
      <form class="contact-form" id="contact-form" action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required autocomplete="name">

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="email">

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" required></textarea>

        <button type="submit" class="btn btn-primary">Send message</button>
        <p class="form-status" id="form-status" role="status"></p>
      </form>
    </div>
  </section>

</main>

<footer class="site-footer">
  <div class="wrap footer-inner">
    <p>&copy; <span id="year"></span> Nick. All rights reserved.</p>
    <div class="socials">
      <a href="links.html">All links →</a>
    </div>
  </div>
</footer>

<script src="script.js"></script>
</body>
